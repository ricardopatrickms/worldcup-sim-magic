name: Deploy to GitHub Pages

on:
  # Publica a cada push na branch main
  push:
    branches: [main]
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

# Permissões necessárias pro GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy por vez (cancela builds antigos em andamento)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Build estático (SPA) com o caminho base do repositório
      - run: bunx vite build --base=/${{ github.event.repository.name }}/
        env:
          GITHUB_PAGES: "true"

      # GitHub Pages serve index.html; o TanStack Start gera _shell.html.
      # Copiamos pra index.html e 404.html (fallback de rotas client-side).
      - run: |
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
